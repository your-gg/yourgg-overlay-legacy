name: deploy

on:
  workflow_call:
    inputs:
      sign:
        required: false
        type: boolean
        default: false
    outputs:
      unsigned-artifact-id:
        description: "Unsigned artifact Id"
        value: ${{ jobs.deploy.outputs.unsigned-artifact-id }}
      signed-artifact-id:
        description: "Signed artifact Id"
        value: ${{ jobs.deploy.outputs.signed-artifact-id }}
    secrets:
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SIGNING_ENDPOINT:
        required: false
      AZURE_SIGNING_ACCOUNT:
        required: false
      AZURE_SIGNING_PROFILE:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      MEMORY_READER_SSH_KEY:
        required: false
  workflow_dispatch:
    inputs:
      sign:
        type: boolean
        required: false
        description: Sign artifacts
        default: false
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'crates/**/*'
      - 'src/**/*'
      - 'xtask/**/*'
      - 'packages/core/**'

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: windows-latest
    # PR CI: environment 없음. publish/수동 실행: deploy environment (yourgg only)
    environment: ${{ github.event_name != 'pull_request' && 'deploy' || null }}
    outputs:
      unsigned-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
      signed-artifact-id: ${{ steps.upload-signed-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.MEMORY_READER_SSH_KEY }}

      - name: Setup cd
        run: |
          git config user.name "YOUR.GG Overlay Continuous Deployment"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Extract Commit SHA
        id: commit-sha
        run: |
          "short_sha=" + "${{ github.sha }}".SubString(0, 8) >> $env:GITHUB_OUTPUT

      - name: Setup rust
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: 'deploy'
          cache-on-failure: true
          cache-all-crates: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Deploy
        run: npm run ci:deploy

      # Upload native debug symbols (PDBs) so Sentry can symbolicate crashes in
      # the overlay DLL / addon / injector helper. Only on real (signed)
      # releases — not PR CI — so we only ship symbols for user-facing binaries.
      # sentry-cli scans each release dir and uploads every PE together with its
      # PDB in one invocation (required to associate the debug identifier).
      # MUST target the SAME Sentry project the consuming app's @sentry/electron
      # sends crashes to, or they won't resolve.
      # A build whose symbols are not in Sentry cannot be debugged: native
      # crashes come back as bare addresses. Such a build is not worth shipping,
      # so this step is allowed to fail the job. It runs BEFORE signing and the
      # artifact uploads, so a failure here means no signed artifact and no npm
      # publish. Do not reorder, and do not re-add continue-on-error.
      - name: Upload debug files (PDB) to Sentry
        id: sentry-debug-files
        if: ${{ inputs.sign }}
        shell: bash
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::SENTRY_AUTH_TOKEN is not set (needed to upload debug files)"
            exit 1
          fi
          npx -y @sentry/cli debug-files upload --include-sources --wait \
            target/x86_64-pc-windows-msvc/release \
            target/i686-pc-windows-msvc/release \
            target/aarch64-pc-windows-msvc/release
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      # Unsigned binaries are published ONLY when this run does not sign. An
      # unsigned DLL must never be injected into a Riot game (the injector also
      # refuses to load one), so a signing run leaves exactly one artifact and
      # it is the signed one. Nobody can grab the wrong download by mistake.
      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        if: ${{ !inputs.sign }}
        uses: actions/upload-artifact@v4
        with:
          name: 'yourgg-overlay-artifact-unsigned-${{ steps.commit-sha.outputs.short_sha }}'
          path: |
            packages/core/addon-aarch64.node
            packages/core/addon-x64.node
            packages/core/yourgg_overlay-aarch64.dll
            packages/core/yourgg_overlay-x86.dll
            packages/core/yourgg_overlay-x64.dll
            packages/core/yourgg-injector-x64.exe

      - name: Stage binaries for signing
        if: ${{ inputs.sign }}
        shell: bash
        run: |
          mkdir -p target/unsigned
          cp packages/core/addon-aarch64.node \
             packages/core/addon-x64.node \
             packages/core/yourgg_overlay-aarch64.dll \
             packages/core/yourgg_overlay-x86.dll \
             packages/core/yourgg_overlay-x64.dll \
             packages/core/yourgg-injector-x64.exe \
             target/unsigned/

      - name: Sign artifacts
        if: ${{ inputs.sign }}
        uses: azure/artifact-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: target/unsigned
          files-folder-filter: dll,node,exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload signed artifact
        id: upload-signed-artifact
        if: ${{ inputs.sign }}
        uses: actions/upload-artifact@v4
        with:
          name: 'yourgg-overlay-artifact-${{ steps.commit-sha.outputs.short_sha }}'
          path: target/unsigned/**/*
