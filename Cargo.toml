[workspace]
members = [
    "./crates/*",
    "./xtask",
    "./examples/rust/*",
    "./packages/core/native",
]
resolver = "2"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Keep debug info so MSVC emits a PDB next to each cdylib/exe. The PDB is NOT
# shipped in the binary (only a CodeView reference is) — it is uploaded to
# Sentry in CI so native crashes in the injected DLL / addon / helper can be
# symbolicated. `debug = 1` is line-tables-only (function + file:line), enough
# for stack traces with no codegen/perf impact; `strip = false` keeps it.
strip = false
debug = 1

[workspace.package]
version = "1.2.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/storycraft/asdf-overlay"
authors = ["storycraft <storycraft@pancake.sh>"]
rust-version = "1.88"

[workspace.dependencies]
asdf-overlay = { version = "1.2.3", path = "./crates/overlay" }
asdf-overlay-dll = { version = "1.2.3", path = "./crates/dll" }
asdf-overlay-hook = { version = "1.2.3", path = "./crates/hook" }
asdf-overlay-client = { version = "1.2.3", path = "./crates/client" }
asdf-overlay-common = { version = "1.2.3", path = "./crates/common" }
asdf-overlay-event = { version = "1.2.3", path = "./crates/event" }
asdf-overlay-vulkan-layer = { version = "1.2.3", path = "./crates/vulkan-layer" }

tokio = "1.47.1"

[workspace.dependencies.windows]
version = "0.62.2"
